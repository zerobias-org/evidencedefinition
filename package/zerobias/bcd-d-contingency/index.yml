code: bcd-d-contingency
name: Contingency Plan
description: |-
  Course of action designed to help an organization respond effectively to a significant future incident, event or situation that may or may not happen.
  A contingency plan is sometimes referred to as "Plan B" or a backup plan because it can also be used as an alternative action if expected results fail to materialize.
